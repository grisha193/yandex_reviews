services:
  - type: web
    name: yandex-reviews-web
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /
    preDeployCommand: php artisan migrate --seed --force --no-interaction
    envVars:
      - fromGroup: yandex-reviews-shared
      - key: DATABASE_URL
        fromDatabase:
          name: yandex-reviews-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "false"

  - type: worker
    name: yandex-reviews-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerCommand: php artisan queue:work --sleep=3 --tries=3 --timeout=180
    envVars:
      - fromGroup: yandex-reviews-shared
      - key: DATABASE_URL
        fromDatabase:
          name: yandex-reviews-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "false"

databases:
  - name: yandex-reviews-db
    plan: basic-256mb
    region: frankfurt
    databaseName: yandex_reviews
    user: yandex_reviews

envVarGroups:
  - name: yandex-reviews-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: YANDEX_MAPS_USER_AGENT
        value: "Mozilla/5.0 (compatible; YandexReviewsBot/1.0)"
